<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚽ 足球知识问答 - 2026世界杯</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0a1628; color:#fff; font-family:'Segoe UI',sans-serif; min-height:100vh; }

.app { max-width:700px; margin:0 auto; padding:20px; }

.header { text-align:center; padding:30px 0; }
.header h1 { font-size:2.5rem; background:linear-gradient(90deg,#ffd700,#ff6b35); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.header p { color:#88aacc; margin-top:8px; }

.menu { text-align:center; }
.menu-btn { display:inline-block; padding:15px 40px; margin:10px; background:linear-gradient(135deg,#1e3a5f,#2a4a6f); border:2px solid #3a6a9f; border-radius:12px; color:#fff; font-size:1.1rem; cursor:pointer; transition:all 0.3s; }
.menu-btn:hover { background:linear-gradient(135deg,#2a5a8f,#3a7abf); border-color:#5a9adf; transform:translateY(-2px); }

.progress { display:flex; align-items:center; gap:10px; margin:20px 0; }
.progress-bar { flex:1; height:8px; background:rgba(255,255,255,0.1); border-radius:4px; overflow:hidden; }
.progress-fill { height:100%; background:linear-gradient(90deg,#ffd700,#ff6b35); border-radius:4px; transition:width 0.5s; }
.progress-text { color:#88aacc; font-size:0.85rem; min-width:60px; text-align:right; }

.question-card { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:16px; padding:30px; margin:20px 0; }
.question-num { color:#ffd700; font-size:0.9rem; margin-bottom:10px; }
.question-text { font-size:1.3rem; line-height:1.6; margin-bottom:25px; }
.question-hint { color:#88aacc; font-size:0.85rem; margin-bottom:15px; font-style:italic; }

.options { display:flex; flex-direction:column; gap:10px; }
.option { display:flex; align-items:center; gap:15px; padding:15px 20px; background:rgba(255,255,255,0.03); border:2px solid rgba(255,255,255,0.1); border-radius:12px; cursor:pointer; transition:all 0.3s; }
.option:hover { border-color:#3a6a9f; background:rgba(58,106,159,0.1); }
.option.selected { border-color:#ffd700; background:rgba(255,215,0,0.1); }
.option.correct { border-color:#4aaa6f; background:rgba(74,170,111,0.15); }
.option.wrong { border-color:#ff4444; background:rgba(255,68,68,0.15); }
.option-letter { width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,0.1); display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:0.9rem; }
.option.correct .option-letter { background:#4aaa6f; }
.option.wrong .option-letter { background:#ff4444; }
.option-text { flex:1; font-size:1rem; }

.explanation { margin-top:20px; padding:15px 20px; background:rgba(74,170,111,0.1); border-left:4px solid #4aaa6f; border-radius:0 8px 8px 0; display:none; }
.explanation.show { display:block; }
.explanation h4 { color:#4aaa6f; margin-bottom:5px; }
.explanation p { color:#aac; font-size:0.95rem; line-height:1.5; }

.btn-row { display:flex; justify-content:center; gap:15px; margin-top:20px; }
.btn { padding:12px 30px; border:none; border-radius:10px; font-size:1rem; cursor:pointer; transition:all 0.3s; }
.btn-primary { background:linear-gradient(135deg,#ffd700,#ff6b35); color:#000; font-weight:bold; }
.btn-primary:hover { transform:translateY(-2px); box-shadow:0 5px 20px rgba(255,215,0,0.3); }
.btn-secondary { background:rgba(255,255,255,0.1); color:#fff; border:1px solid rgba(255,255,255,0.2); }
.btn-secondary:hover { background:rgba(255,255,255,0.15); }

.timer { text-align:center; font-size:1.5rem; color:#ffd700; margin:10px 0; }
.timer.warning { color:#ff4444; animation:pulse 0.5s infinite; }
@keyframes pulse { 50% { opacity:0.5; } }

.result { text-align:center; padding:40px 20px; }
.result h2 { font-size:2.5rem; margin-bottom:10px; }
.result .score { font-size:5rem; color:#ffd700; margin:20px 0; }
.result .detail { color:#88aacc; font-size:1.1rem; margin-bottom:10px; }
.result .grade { font-size:1.5rem; margin:15px 0; }
.result .stats { display:flex; justify-content:center; gap:30px; margin:25px 0; flex-wrap:wrap; }
.stat { text-align:center; }
.stat .num { font-size:2rem; color:#ffd700; }
.stat .label { color:#88aacc; font-size:0.85rem; }

.categories { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin:20px 0; }
.cat-btn { padding:15px; background:rgba(255,255,255,0.05); border:2px solid rgba(255,255,255,0.1); border-radius:10px; cursor:pointer; transition:all 0.3s; text-align:center; }
.cat-btn:hover { border-color:#3a6a9f; }
.cat-btn.selected { border-color:#ffd700; background:rgba(255,215,0,0.1); }
.cat-btn .emoji { font-size:2rem; }
.cat-btn .name { font-size:0.9rem; margin-top:5px; color:#aac; }

.leaderboard { margin:20px 0; }
.lb-row { display:flex; align-items:center; gap:15px; padding:12px 15px; background:rgba(255,255,255,0.03); border-radius:8px; margin-bottom:5px; }
.lb-rank { width:30px; font-weight:bold; color:#ffd700; }
.lb-score { margin-left:auto; color:#ffd700; }
.lb-time { color:#88aacc; font-size:0.85rem; }

.hidden { display:none !important; }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <h1>⚽ 足球知识问答</h1>
    <p>2026 FIFA 世界杯 知识挑战 · 80+题库</p>
  </div>

  <div id="menuView">
    <div class="menu">
      <button class="menu-btn" onclick="startQuick()">快速挑战 (15题)</button>
      <button class="menu-btn" onclick="showCategorySelect()">分类挑战</button>
      <button class="menu-btn" onclick="showLeaderboard()">排行榜</button>
    </div>
  </div>

  <div id="categoryView" class="hidden">
    <h3 style="text-align:center;color:#aac;margin-bottom:15px;">选择题目分类</h3>
    <div class="categories" id="catGrid"></div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="startCategory()">开始挑战</button>
      <button class="btn btn-secondary" onclick="showMenu()">返回</button>
    </div>
  </div>

  <div id="quizView" class="hidden">
    <div class="progress">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-text" id="progressText">1/15</div>
    </div>
    <div class="timer" id="timer">30</div>
    <div class="question-card">
      <div class="question-num" id="qNum">第 1 题</div>
      <div class="question-text" id="qText"></div>
      <div class="question-hint" id="qHint"></div>
      <div class="options" id="options"></div>
      <div class="explanation" id="explanation">
        <h4>📖 解析</h4>
        <p id="explainText"></p>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary hidden" id="nextBtn" onclick="nextQuestion()">下一题</button>
    </div>
  </div>

  <div id="resultView" class="hidden">
    <div class="result">
      <h2 id="resultTitle"></h2>
      <div class="score" id="resultScore"></div>
      <div class="grade" id="resultGrade"></div>
      <div class="detail" id="resultDetail"></div>
      <div class="stats">
        <div class="stat"><div class="num" id="statCorrect">0</div><div class="label">答对</div></div>
        <div class="stat"><div class="num" id="statWrong">0</div><div class="label">答错</div></div>
        <div class="stat"><div class="num" id="statTime">0s</div><div class="label">用时</div></div>
        <div class="stat"><div class="num" id="statStreak">0</div><div class="label">最长连对</div></div>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="restart()">再来一次</button>
        <button class="btn btn-secondary" onclick="showMenu()">返回菜单</button>
      </div>
    </div>
  </div>

  <div id="leaderView" class="hidden">
    <h3 style="text-align:center;color:#ffd700;margin-bottom:20px;">🏆 排行榜</h3>
    <div class="leaderboard" id="lbList"></div>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="showMenu()">返回</button>
      <button class="btn btn-secondary" onclick="clearLeaderboard()">清空记录</button>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [
  // ===== 世界杯历史 (18题) =====
  { cat:'history', q:'第一届世界杯在哪一年举办？', opts:['1932年','1930年','1926年','1928年'], ans:1, explain:'第一届世界杯于1930年在乌拉圭举办，东道主乌拉圭队在决赛中4-2击败阿根廷夺冠。共有13支球队参加。' },
  { cat:'history', q:'哪支球队获得世界杯冠军次数最多？', opts:['巴西','阿根廷','意大利','德国'], ans:0, explain:'巴西队共获得5次世界杯冠军（1958、1962、1970、1994、2002），是唯一一支参加了所有世界杯的球队。' },
  { cat:'history', q:'2026年世界杯将在哪三个国家联合举办？', opts:['墨西哥、巴西、阿根廷','美国、墨西哥、巴西','美国、加拿大、墨西哥','加拿大、美国、英国'], ans:2, explain:'2026年世界杯由美国、加拿大和墨西哥三国联合举办，这是历史上首次由三个国家联合举办世界杯。' },
  { cat:'history', q:'哪位球员在世界杯历史上进球最多？', opts:['克洛泽(16球)','盖德·穆勒(14球)','方丹(13球)','罗纳尔多(15球)'], ans:0, explain:'德国球员克洛泽在2002-2014年四届世界杯中共打入16球，超越了罗纳尔多的15球纪录。' },
  { cat:'history', q:'2026年世界杯决赛圈将有多少支球队参加？', opts:['32支','40支','48支','36支'], ans:2, explain:'2026年世界杯将首次扩军至48支球队，分为12个小组，每组4队，是世界杯历史上最大规模的扩军。' },
  { cat:'history', q:'哪一届世界杯首次使用VAR技术？', opts:['2014年巴西','2022年卡塔尔','2010年南非','2018年俄罗斯'], ans:3, explain:'2018年俄罗斯世界杯首次在世界杯赛场上使用VAR（视频助理裁判）技术，极大地改变了比赛的判罚方式。' },
  { cat:'history', q:'世界杯历史上最快的进球记录是多少秒？', opts:['11.2秒','10.8秒','12.5秒','8.9秒'], ans:1, explain:'2002年世界杯土耳其球员哈坎·苏克对阵韩国时打入，仅用时10.8秒，至今仍是世界杯最快进球纪录。' },
  { cat:'history', q:'哪一届世界杯被称为"马拉多纳的世界杯"？', opts:['1978年阿根廷','1982年西班牙','1986年墨西哥','1990年意大利'], ans:2, explain:'1986年墨西哥世界杯，马拉多纳几乎以一己之力带领阿根廷夺冠，其中对英格兰的"上帝之手"和"世纪进球"成为经典。' },
  { cat:'history', q:'世界杯历史上唯一一支成功卫冕的球队是？', opts:['意大利(1934/1938)','巴西(1958/1962)','阿根廷(1986/1990)','德国(1974/1978)'], ans:1, explain:'巴西队在1958年和1962年连续两届世界杯夺冠，是唯一成功卫冕的球队。意大利在1934和1938年也连续夺冠，但当时赛制不同。' },
  { cat:'history', q:'2022年卡塔尔世界杯的冠军是？', opts:['克罗地亚','阿根廷','法国','摩洛哥'], ans:1, explain:'2022年卡塔尔世界杯决赛，阿根廷在点球大战中4-2击败法国（常规时间3-3），梅西终于圆梦世界杯。' },
  { cat:'history', q:'世界杯历史上单届比赛进球最多的球员是？', opts:['盖德·穆勒(10球)','克洛泽(16球)','贝利(12球)','方丹(13球)'], ans:3, explain:'法国球员方丹在1958年瑞典世界杯中打入13球，创造了单届世界杯进球纪录，至今无人打破。' },
  { cat:'history', q:'2010年世界杯在哪个国家举办？', opts:['韩国/日本','南非','德国','巴西'], ans:1, explain:'2010年南非世界杯是非洲大陆首次举办世界杯，西班牙最终夺冠，成为新的世界冠军。' },
  { cat:'history', q:'世界杯的奖杯叫什么名字？', opts:['金球杯','雷米特杯','大力神杯','冠军杯'], ans:2, explain:'世界杯冠军奖杯名为"大力神杯"（FIFA World Cup Trophy），自1974年起使用。之前的奖杯叫"雷米特杯"，已被巴西永久保留。' },
  { cat:'history', q:'哪支球队被称为"无冕之王"？', opts:['巴西','荷兰','德国','意大利'], ans:1, explain:'荷兰队三次进入世界杯决赛（1974、1978、2010）但均未能夺冠，因此被称为"无冕之王"。' },
  { cat:'history', q:'2014年巴西世界杯半决赛，德国7-1大胜巴西，德国队上半场进了几球？', opts:['5球','3球','6球','4球'], ans:0, explain:'2014年世界杯半决赛，德国队在上半场就打入5球（其中4球在6分钟内打入），最终7-1狂胜东道主巴西，震惊世界。' },
  { cat:'history', q:'世界杯历史上第一个进球是由谁打入的？', opts:['吕西安·洛朗','贝利','吉列尔莫·斯塔比莱','普斯卡什'], ans:0, explain:'1930年首届世界杯，法国球员吕西安·洛朗在法国对墨西哥的比赛中打入了世界杯历史上的第一个进球。' },
  { cat:'history', q:'哪届世界杯首次有亚洲球队进入四强？', opts:['2002年韩日世界杯','2010年南非','2006年德国','2018年俄罗斯'], ans:0, explain:'2002年韩日世界杯，韩国队在主场闯入四强（最终第四名），创造了亚洲球队在世界杯上的最佳战绩。' },
  { cat:'history', q:'世界杯预选赛中，哪个大洲的名额最多？', opts:['南美洲(6席)','亚洲(8席)','欧洲(16席)','非洲(9席)'], ans:2, explain:'2026年世界杯48队中，欧洲(UEFA)获得16个名额，是各大洲中最多的。亚洲8.5席，非洲9.5席，南美6.5席。' },

  // ===== 球星传奇 (18题) =====
  { cat:'players', q:'梅西在2022年世界杯决赛中打入几球？', opts:['1球','3球','0球','2球'], ans:3, explain:'梅西在2022年卡塔尔世界杯决赛中打入2球（包括加时赛进球），帮助阿根廷夺冠，个人获得金球奖。' },
  { cat:'players', q:'C罗代表葡萄牙参加过几届世界杯？', opts:['4届','3届','6届','5届'], ans:3, explain:'C罗参加了2006、2010、2014、2018和2022年五届世界杯，是葡萄牙足球的标志性人物。' },
  { cat:'players', q:'贝利获得过几次世界杯冠军？', opts:['3次','4次','2次','1次'], ans:0, explain:'贝利在1958、1962和1970年三届世界杯中帮助巴西夺冠，是唯一一位三次获得世界杯冠军的球员。' },
  { cat:'players', q:'哪位球员被称为"外星人"？', opts:['齐达内','小罗','罗纳尔多(大罗)','亨利'], ans:2, explain:'巴西球员罗纳尔多·纳扎里奥因其超凡的足球天赋被称为"外星人"(O Fenômeno)，两获世界杯冠军。' },
  { cat:'players', q:'姆巴佩在2018年世界杯决赛中打入几球？', opts:['1球','0球','3球','2球'], ans:3, explain:'姆巴佩在2018年世界杯决赛中打入2球，成为继贝利之后第二位在世界杯决赛进球的青少年球员。' },
  { cat:'players', q:'2022年世界杯金球奖得主是谁？', opts:['姆巴佩','莫德里奇','格列兹曼','梅西'], ans:3, explain:'梅西在2022年卡塔尔世界杯中表现出色，获得金球奖，同时带领阿根廷夺冠。' },
  { cat:'players', q:'齐达内在2006年世界杯决赛中因什么动作被红牌罚下？', opts:['恶意铲球','辱骂裁判','肘击对手','头撞马特拉齐'], ans:3, explain:'2006年世界杯决赛，齐达内在加时赛中头撞意大利球员马特拉齐，被红牌罚下，法国最终在点球大战中失利。' },
  { cat:'players', q:'哪位球员被称为"足球之王"？', opts:['马拉多纳','C罗','贝利','梅西'], ans:2, explain:'巴西球员贝利被FIFA评为"世纪最佳球员"，被广泛称为"足球之王"(O Rei do Futebol)。' },
  { cat:'players', q:'2022年世界杯金靴奖得主是谁？', opts:['阿尔瓦雷斯(4球)','姆巴佩(8球)','梅西(7球)','吉鲁(4球)'], ans:1, explain:'法国球员姆巴佩在2022年世界杯中打入8球，获得金靴奖，其中包括决赛中的帽子戏法。' },
  { cat:'players', q:'哪位球员在世界杯上完成了"帽子戏法"最多次？', opts:['贝利(2次)','方丹(2次)','克洛泽(2次)','姆巴佩(2次)'], ans:1, explain:'多位球员在世界杯上完成过多次帽子戏法，方丹、克洛泽等人都有多次记录。' },
  { cat:'players', q:'马拉多纳的"世纪进球"是在哪场比赛中打入的？', opts:['阿根廷vs意大利(1990)','阿根廷vs巴西(1990)','阿根廷vs德国(1986)','阿根廷vs英格兰(1986)'], ans:3, explain:'1986年世界杯四分之一决赛，马拉多纳从中场带球连过五人打入进球，被称为"世纪进球"。' },
  { cat:'players', q:'诺伊尔被称为"清道夫门将"是因为他擅长什么？', opts:['扑点球','出击到禁区外防守','指挥防线','长传发动进攻'], ans:1, explain:'德国门将诺伊尔以出击范围大著称，经常冲出禁区外解围，因此被称为"清道夫门将"(Sweeper-Keeper)。' },
  { cat:'players', q:'哪位球员在2014年世界杯打入6球获得金靴奖？', opts:['内马尔','穆勒','J罗(哈梅斯·罗德里格斯)','梅西'], ans:2, explain:'哥伦比亚球员J罗在2014年巴西世界杯中打入6球获得金靴奖，其中对乌拉圭的凌空抽射当选赛事最佳进球。' },
  { cat:'players', q:'伊涅斯塔在2010年世界杯决赛中打入了什么关键进球？', opts:['加时赛绝杀进球','点球','头球','任意球'], ans:0, explain:'2010年世界杯决赛，伊涅斯塔在加时赛第116分钟打入制胜球，帮助西班牙1-0击败荷兰夺冠。' },
  { cat:'players', q:'布冯代表意大利参加过几届世界杯？', opts:['6届','3届','4届','5届'], ans:3, explain:'意大利传奇门将布冯参加了1998、2002、2006、2010和2014年五届世界杯，2006年帮助意大利夺冠。' },
  { cat:'players', q:'哪位球员被称为"狮王"？', opts:['卡西利亚斯','布冯','卡恩','诺伊尔'], ans:2, explain:'德国门将卡恩因其凶猛的比赛风格和出色的扑救能力被称为"狮王"(Der Titan)。' },
  { cat:'players', q:'2018年世界杯金球奖得主是？', opts:['莫德里奇','坎特','格列兹曼','姆巴佩'], ans:0, explain:'克罗地亚球员莫德里奇在2018年世界杯中带领克罗地亚闯入决赛，获得金球奖，同年还获得金球奖。' },
  { cat:'players', q:'罗伯特·巴乔在1994年世界杯决赛中罚丢了什么关键球？', opts:['点球大战的最后一个点球','任意球','角球','加时赛的点球'], ans:0, explain:'1994年世界杯决赛，意大利球星巴乔在点球大战中踢飞最后一个点球，意大利不敌巴西，巴乔低头站立的画面成为经典。' },

  { cat:'rules', q:'一场标准足球比赛的时间是多少分钟？', opts:['100分钟','80分钟','90分钟','70分钟'], ans:2, explain:'一场标准足球比赛分为上下两个半场，各45分钟，共90分钟（不含补时和加时赛）。' },
  { cat:'rules', q:'越位规则中，球员处于越位位置的判定标准是？', opts:['比球和倒数第二名防守球员更靠近对方球门线','比球更靠近对方球门线','在对方半场即可','比最后一名防守球员更靠近对方球门线'], ans:0, explain:'越位判定：在队友传球瞬间，进攻球员比球和倒数第二名防守球员更靠近对方球门线时处于越位位置。' },
  { cat:'rules', q:'一名球员在一场比赛中得到几张黄牌会被罚下？', opts:['1张','3张','4张','2张'], ans:3, explain:'一名球员在同一场比赛中得到2张黄牌将被红牌罚下场（两黄变一红）。' },
  { cat:'rules', q:'点球点距离球门线多远？', opts:['12米','9米','11米(12码)','10米'], ans:2, explain:'罚球点距离球门线11米（12码），这也是"12码球"名称的由来。' },

  { cat:'rules', q:'世界杯小组赛中，胜一场得几分？', opts:['3分','4分','2分','1分'], ans:0, explain:'世界杯小组赛采用胜3分、平1分、负0分的积分制度，这一制度从1994年世界杯开始使用。' },
  { cat:'rules', q:'守门员在禁区内可以用手触球吗？', opts:['任何时候都可以','可以，但不能接队友故意回传球','不可以','只能在小禁区内'], ans:1, explain:'守门员在本方禁区内可以用手触球，但不能接队友用脚故意回传的球（1992年规则修改）。' },
  { cat:'rules', q:'足球场上的禁区（罚球区）尺寸是多少？', opts:['16.5米×40.32米','20米×45米','15米×35米','18米×36米'], ans:0, explain:'罚球区从球门柱起16.5米，总宽度为40.32米（球门宽度7.32米+两侧各16.5米）。' },
  { cat:'rules', q:'加时赛的总时长是多少分钟？', opts:['45分钟','30分钟','20分钟','15分钟'], ans:1, explain:'世界杯淘汰赛如果常规时间平局，进行30分钟加时赛（上下半场各15分钟）。2018年起取消了加时赛中的客场进球规则。' },
  { cat:'rules', q:'一场比赛中，一支球队最多可以换几名球员？', opts:['6人','4人','3人','5人'], ans:3, explain:'自2022年起，FIFA正式将比赛中每队换人名额从3人增加到5人（含中场休息时的换人）。' },
  { cat:'rules', q:'手球犯规的判定中，手臂的范围是？', opts:['只有手','整个手臂','手和手臂（到腋下）','手和前臂'], ans:2, explain:'根据最新规则，手球犯规包括手和手臂到腋下的范围。如果球触碰到这个范围内的手臂且是不自然的扩大身体面积，将被判罚手球。' },
  { cat:'rules', q:'任意球分为几种类型？', opts:['1种','2种（直接和间接）','4种','3种'], ans:1, explain:'任意球分为直接任意球（可以直接射门得分）和间接任意球（必须经过第二名球员触球后才能射门得分）。' },
  { cat:'rules', q:'角旗杆的高度最低是多少？', opts:['1.2米','1米','1.5米','2米'], ans:2, explain:'角旗杆高度不低于1.5米，旗杆不能是尖锐的，以确保球员安全。' },
  { cat:'rules', q:'球门的尺寸是多少？', opts:['宽8.00米×高2.50米','宽7.50米×高2.50米','宽7.00米×高2.40米','宽7.32米×高2.44米'], ans:3, explain:'标准球门宽7.32米（8码），高2.44米（8英尺），这一尺寸自1863年以来从未改变。' },

  // ===== 战术阵型 (12题) =====
  { cat:'tactics', q:'4-3-3阵型中有几名中场球员？', opts:['2名','3名','4名','5名'], ans:1, explain:'4-3-3阵型由4名后卫、3名中场和3名前锋组成，是一种攻守平衡的阵型，巴萨和利物浦常使用。' },
  { cat:'tactics', q:'"全攻全守"战术最早由哪支球队发扬光大？', opts:['巴西(1970年)','意大利(1982年)','荷兰(1974年)','德国(1972年)'], ans:2, explain:'全攻全守(Total Football)战术由荷兰队在1970年代发扬，教练米歇尔斯和核心克鲁伊夫是关键人物。' },
  { cat:'tactics', q:'Tiki-taka战术以哪支球队为代表？', opts:['曼联','拜仁慕尼黑','巴塞罗那/西班牙','AC米兰'], ans:2, explain:'Tiki-taka短传配合战术以瓜迪奥拉执教的巴塞罗那和西班牙国家队为代表，强调控球和快速短传。' },
  { cat:'tactics', q:'"摆大巴"(Park the Bus)战术的核心思想是？', opts:['快速反击','高位逼抢','全力防守，密集防守','全攻全守'], ans:2, explain:'"摆大巴"指全队退守、密集防守的战术，该词由穆里尼奥推广使用，意指像大巴车一样堵在球门前。' },
  { cat:'tactics', q:'高位逼抢(Pressing)战术要求球员在何处开始防守？', opts:['本方半场','对方半场','球门附近','中场'], ans:1, explain:'高位逼抢要求球员在对方半场就开始积极抢断，压缩对手传球空间，克洛普的"重金属足球"是典型代表。' },
  { cat:'tactics', q:'3-5-2阵型中，边路的主要攻防依靠谁？', opts:['中锋','翼卫(边前卫)','中后卫','后腰'], ans:1, explain:'3-5-2阵型中的翼卫(Wing-Back)承担边路的攻防重任，需要有出色的体能和往返能力。' },
  { cat:'tactics', q:'"反击"战术的关键要素是？', opts:['密集防守','长时间控球','高位逼抢','快速由守转攻'], ans:3, explain:'反击战术的关键是在夺回球权后快速向前推进，利用对手阵型前压后的空档创造机会。' },
  { cat:'tactics', q:'"伪九号"(False 9)战术指的是什么？', opts:['中锋不参与防守','中锋拉边','中锋回撤拿球组织进攻','中锋只负责头球'], ans:2, explain:'"伪九号"指中锋位置的球员频繁回撤到中场拿球，拉出对方中后卫，为队友创造空间。梅西在瓜迪奥拉手下曾担任此角色。' },
  { cat:'tactics', q:'4-4-2阵型的菱形中场和平行中场有什么区别？', opts:['没有区别','菱形中场有两名后腰','菱形中场有一名前腰，平行中场四人一字排开','平行中场有一名前腰'], ans:2, explain:'菱形中场有一名前腰和一名后腰，左右各一人；平行中场四人在一条线上。菱形中场攻击力更强，平行中场更平衡。' },
  { cat:'tactics', q:'越位陷阱(Offside Trap)是什么战术？', opts:['前锋故意越位','守门员出击','后卫线整体前压制造越位','中场拦截'], ans:2, explain:'越位陷阱是后卫线在对手传球瞬间整体前压，使进攻球员处于越位位置。风险很大，一旦失败对手就会获得单刀机会。' },
  { cat:'tactics', q:'"控球率"高的球队一定赢吗？', opts:['看对手强弱','一定','基本会赢','不一定，效率更重要'], ans:3, explain:'控球率高不等于赢球。2010年世界杯西班牙场均控球率超65%夺冠，但2018年法国以防守反击夺冠，场均控球率不到50%。' },
  { cat:'tactics', q:'瓜迪奥拉的"位置足球"(Positional Play)核心思想是？', opts:['长传冲吊','全场紧逼','通过站位创造局部人数优势','防守反击'], ans:2, explain:'位置足球强调球员在场上的站位和移动，通过传球和跑位创造局部人数优势，控制比赛节奏和空间。' },

  { cat:'2026', q:'2026年世界杯的32强淘汰赛从哪个阶段开始？', opts:['直接半决赛','16强(1/8决赛)','8强(1/4决赛)','32强(1/16决赛)'], ans:3, explain:'由于扩军至48队，2026年世界杯新增了32强赛（1/16决赛），这是世界杯历史上首次有此阶段。' },

function showMenu() {
  hideAll();
  document.getElementById('menuView').classList.remove('hidden');
}
function showCategorySelect() {
  hideAll();
  document.getElementById('categoryView').classList.remove('hidden');
  buildCatGrid();
}
function showLeaderboard() {
  hideAll();
  document.getElementById('leaderView').classList.remove('hidden');
  renderLeaderboard();
}
function hideAll() {
  ['menuView','categoryView','quizView','resultView','leaderView'].forEach(id => {
    document.getElementById(id).classList.add('hidden');
  });
  clearInterval(timerInterval);
}

function buildCatGrid() {
  const grid = document.getElementById('catGrid');
  grid.innerHTML = '';
  CATEGORIES.forEach(c => {
    const count = QUESTIONS.filter(q => q.cat === c.id).length;
    const btn = document.createElement('div');
    btn.className = 'cat-btn' + (selectedCat === c.id ? ' selected' : '');
    btn.innerHTML = `<div class="emoji">${c.emoji}</div><div class="name">${c.name}</div><div style="color:#668;font-size:0.8rem;">${count}题</div>`;
    btn.onclick = () => { selectedCat = c.id; buildCatGrid(); };
    grid.appendChild(btn);
  });
}

function startQuick() {
  selectedCat = null;
  startQuiz(shuffle([...QUESTIONS]).slice(0, 15));
}

function startCategory() {
  if (!selectedCat) { alert('请选择一个分类'); return; }
  const qs = QUESTIONS.filter(q => q.cat === selectedCat);
  startQuiz(shuffle([...qs]));
}

function startQuiz(questions) {
  currentQuestions = questions;
  currentIdx = 0;
  score = 0;
  correctCount = 0;
  wrongCount = 0;
  streak = 0;
  maxStreak = 0;
  startTime = Date.now();

  hideAll();
  document.getElementById('quizView').classList.remove('hidden');
  showQuestion();
}

function showQuestion() {
  const q = currentQuestions[currentIdx];
  answered = false;

  const pct = ((currentIdx) / currentQuestions.length * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${currentIdx + 1}/${currentQuestions.length}`;
  document.getElementById('qNum').textContent = `第 ${currentIdx + 1} 题`;
  document.getElementById('qText').textContent = q.q;

  const catInfo = CATEGORIES.find(c => c.id === q.cat);
  document.getElementById('qHint').textContent = catInfo ? `分类：${catInfo.emoji} ${catInfo.name}` : '';

  const optDiv = document.getElementById('options');
  optDiv.innerHTML = '';
  const letters = ['A', 'B', 'C', 'D'];
  q.opts.forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = 'option';
    div.innerHTML = `<div class="option-letter">${letters[i]}</div><div class="option-text">${opt}</div>`;
    div.onclick = () => selectOption(i);
    optDiv.appendChild(div);
  });

  document.getElementById('explanation').classList.remove('show');
  document.getElementById('nextBtn').classList.add('hidden');

  timeLeft = 30;
  document.getElementById('timer').textContent = timeLeft;
  document.getElementById('timer').classList.remove('warning');
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timeLeft--;
    document.getElementById('timer').textContent = timeLeft;
    if (timeLeft <= 10) document.getElementById('timer').classList.add('warning');
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      timeUp();
    }
  }, 1000);
}

function selectOption(idx) {
  if (answered) return;
  answered = true;
  clearInterval(timerInterval);

  const q = currentQuestions[currentIdx];
  const options = document.querySelectorAll('.option');
  const isCorrect = idx === q.ans;

  options.forEach((opt, i) => {
    opt.style.pointerEvents = 'none';
    if (i === q.ans) opt.classList.add('correct');
    if (i === idx && !isCorrect) opt.classList.add('wrong');
  });

  if (isCorrect) {
    correctCount++;
    streak++;
    maxStreak = Math.max(maxStreak, streak);
    const timeBonus = Math.floor(timeLeft * 2);
    score += 100 + timeBonus;
  } else {
    wrongCount++;
    streak = 0;
  }

  document.getElementById('explainText').textContent = q.explain;
  document.getElementById('explanation').classList.add('show');
  document.getElementById('nextBtn').classList.remove('hidden');
  document.getElementById('nextBtn').textContent = currentIdx < currentQuestions.length - 1 ? '下一题' : '查看结果';
}

function timeUp() {
  if (answered) return;
  answered = true;
  wrongCount++;
  streak = 0;

  const q = currentQuestions[currentIdx];
  const options = document.querySelectorAll('.option');
  options.forEach((opt, i) => {
    opt.style.pointerEvents = 'none';
    if (i === q.ans) opt.classList.add('correct');
  });

  document.getElementById('explainText').textContent = '⏰ 时间到！' + q.explain;
  document.getElementById('explanation').classList.add('show');
  document.getElementById('nextBtn').classList.remove('hidden');
  document.getElementById('nextBtn').textContent = currentIdx < currentQuestions.length - 1 ? '下一题' : '查看结果';
}

function nextQuestion() {
  currentIdx++;
  if (currentIdx >= currentQuestions.length) {
    showResult();
  } else {
    showQuestion();
  }
}

function showResult() {
  hideAll();
  document.getElementById('resultView').classList.remove('hidden');

  const total = currentQuestions.length;
  const pct = Math.round((correctCount / total) * 100);
  const elapsed = Math.round((Date.now() - startTime) / 1000);

  document.getElementById('resultScore').textContent = score;
  document.getElementById('statCorrect').textContent = correctCount;
  document.getElementById('statWrong').textContent = wrongCount;
  document.getElementById('statTime').textContent = elapsed + 's';
  document.getElementById('statStreak').textContent = maxStreak;

  let title, grade, detail;
  if (pct >= 90) { title='🏆 足球大师！'; grade='S'; detail='你的足球知识令人惊叹！'; }
  else if (pct >= 70) { title='⭐ 资深球迷'; grade='A'; detail='你对足球非常了解！'; }
  else if (pct >= 50) { title='👍 足球爱好者'; grade='B'; detail='继续学习，你会更强！'; }
  else if (pct >= 30) { title='📚 初学者'; grade='C'; detail='多看看比赛，积累知识！'; }
  else { title='🌱 足球萌新'; grade='D'; detail='没关系，每个人都有开始！'; }

  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultGrade').textContent = `评级：${grade} (${pct}%)`;
  document.getElementById('resultDetail').textContent = detail;

  saveRecord({ score, correct:correctCount, total, time:elapsed, date:new Date().toLocaleDateString() });
}

function restart() {
  if (selectedCat) startCategory();
  else startQuick();
}

function getRecords() {
  try { return JSON.parse(localStorage.getItem('football_quiz_records') || '[]'); }
  catch(e) { return []; }
}

function saveRecord(record) {
  const records = getRecords();
  records.push(record);
  records.sort((a, b) => b.score - a.score);
  localStorage.setItem('football_quiz_records', JSON.stringify(records.slice(0, 20)));
}

function renderLeaderboard() {
  const records = getRecords();
  const list = document.getElementById('lbList');
  if (records.length === 0) {
    list.innerHTML = '<p style="text-align:center;color:#668;">暂无记录</p>';
    return;
  }
  list.innerHTML = records.slice(0, 10).map((r, i) => `
    <div class="lb-row">
      <div class="lb-rank">${i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : i+1}</div>
      <div>${r.correct}/${r.total}题</div>
      <div class="lb-time">${r.time}s</div>
      <div class="lb-score">${r.score}分</div>
    </div>
  `).join('');
}

function clearLeaderboard() {
  if (confirm('确定要清空所有记录吗？')) {
    localStorage.removeItem('football_quiz_records');
    renderLeaderboard();
  }
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
</script>
