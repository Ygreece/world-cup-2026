<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 世界杯 - FIFA World Cup</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #c8102e;
            --secondary: #002b5c;
            --gold: #d4af37;
            --dark: #0a0a0a;
            --darker: #050505;
            --card-bg: #111111;
            --text: #ffffff;
            --text-muted: #888888;
            --border: #222222;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--darker);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 背景动画 */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .bg-animation::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 20% 50%, rgba(200, 16, 46, 0.08) 0%, transparent 50%),
                        radial-gradient(ellipse at 80% 50%, rgba(0, 43, 92, 0.08) 0%, transparent 50%);
            animation: bgPulse 20s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-5%, -5%) scale(1.1); }
        }

        /* 导航栏 */
        .navbar {
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 0 2rem;
        }

        .nav-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 70px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.5rem;
            font-weight: 800;
            text-decoration: none;
            color: var(--text);
        }

        .logo-icon {
            font-size: 2rem;
        }

        .logo-text span {
            background: linear-gradient(135deg, var(--primary), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s;
            position: relative;
            padding: 0.5rem 0;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--text);
        }

        .nav-links a.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--primary);
        }

        /* 主容器 */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* 英雄区域 - 倒计时 */
        .hero {
            text-align: center;
            padding: 4rem 0;
            position: relative;
        }

        .hero-title {
            font-size: 4rem;
            font-weight: 900;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--text), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 100px rgba(212, 175, 55, 0.3);
        }

        .hero-subtitle {
            font-size: 1.5rem;
            color: var(--text-muted);
            margin-bottom: 3rem;
        }

        .hero-location {
            display: flex;
            justify-content: center;
            gap: 3rem;
            margin-bottom: 3rem;
            flex-wrap: wrap;
        }

        .location-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .location-item span {
            font-size: 1.5rem;
        }

        /* 倒计时 */
        .countdown {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 3rem;
            flex-wrap: wrap;
        }

        .countdown-item {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem 2rem;
            min-width: 120px;
            transition: all 0.3s;
        }

        .countdown-item:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: 0 10px 30px rgba(200, 16, 46, 0.2);
        }

        .countdown-number {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }

        .countdown-label {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* 标签页导航 */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 3rem;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 0.8rem 1.5rem;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.3s;
        }

        .tab-btn:hover {
            border-color: var(--primary);
            color: var(--text);
        }

        .tab-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        /* 内容区域 */
        .tab-content {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 分组卡片 */
        .groups-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .group-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s;
        }

        .group-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border-color: var(--primary);
        }

        .group-header {
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            padding: 1rem 1.5rem;
            font-weight: 700;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .group-teams {
            padding: 0.5rem 0;
        }

        .team-row {
            display: flex;
            align-items: center;
            padding: 0.8rem 1.5rem;
            transition: background 0.2s;
            cursor: pointer;
        }

        .team-row:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .team-rank {
            width: 30px;
            height: 30px;
            background: var(--border);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
            margin-right: 1rem;
        }

        .team-rank.top {
            background: var(--primary);
        }

        .team-flag {
            font-size: 1.5rem;
            margin-right: 0.8rem;
        }

        .team-name {
            flex: 1;
            font-weight: 500;
        }

        .team-stats {
            display: flex;
            gap: 1rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .team-stats span {
            width: 25px;
            text-align: center;
        }

        .team-points {
            font-weight: 700;
            color: var(--gold);
            margin-left: 1rem;
            min-width: 30px;
            text-align: center;
        }

        /* 比赛卡片 */
        .matches-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .match-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s;
            cursor: pointer;
        }

        .match-card:hover {
            transform: translateX(5px);
            border-color: var(--primary);
        }

        .match-team {
            display: flex;
            align-items: center;
            gap: 1rem;
            min-width: 200px;
        }

        .match-team.home {
            justify-content: flex-end;
            text-align: right;
        }

        .match-score {
            background: var(--darker);
            padding: 0.8rem 1.5rem;
            border-radius: 10px;
            font-size: 1.5rem;
            font-weight: 800;
            min-width: 100px;
            text-align: center;
            letter-spacing: 5px;
        }

        .match-info {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            min-width: 150px;
        }

        .match-info .time {
            color: var(--primary);
            font-weight: 600;
        }

        /* 淘汰赛对阵图 */
        .bracket {
            overflow-x: auto;
            padding: 2rem 0;
        }

        .bracket-container {
            display: flex;
            gap: 3rem;
            min-width: 1200px;
            justify-content: center;
        }

        .round {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            min-width: 200px;
        }

        .round-title {
            text-align: center;
            font-weight: 700;
            color: var(--gold);
            margin-bottom: 1rem;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .bracket-match {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s;
        }

        .bracket-match:hover {
            border-color: var(--primary);
            transform: scale(1.02);
        }

        .bracket-team {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.8rem 1rem;
            border-bottom: 1px solid var(--border);
        }

        .bracket-team:last-child {
            border-bottom: none;
        }

        .bracket-team.winner {
            background: rgba(200, 16, 46, 0.1);
        }

        .bracket-team-info {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .bracket-team-score {
            font-weight: 700;
            min-width: 25px;
            text-align: center;
        }

        /* 模拟器 */
        .simulator {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 3rem;
            text-align: center;
            max-width: 600px;
            margin: 0 auto;
        }

        .simulator-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 2rem;
        }

        .team-select {
            display: flex;
            gap: 2rem;
            justify-content: center;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .team-select-group {
            flex: 1;
            min-width: 200px;
        }

        .team-select-group label {
            display: block;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .team-select-group select {
            width: 100%;
            padding: 1rem;
            background: var(--darker);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 1rem;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
        }

        .vs-text {
            font-size: 2rem;
            font-weight: 900;
            color: var(--primary);
        }

        .simulate-btn {
            background: linear-gradient(135deg, var(--primary), #e63950);
            border: none;
            color: white;
            padding: 1rem 3rem;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 2rem;
        }

        .simulate-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(200, 16, 46, 0.4);
        }

        .simulate-btn:active {
            transform: translateY(0);
        }

        .match-result {
            background: var(--darker);
            border-radius: 16px;
            padding: 2rem;
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .match-result.show {
            display: block;
        }

        .result-score {
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: 10px;
            margin: 1rem 0;
            background: linear-gradient(135deg, var(--primary), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .result-teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .result-team {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .result-team .flag {
            font-size: 3rem;
        }

        .result-team .name {
            font-weight: 600;
        }

        .goal-scorers {
            margin-top: 1.5rem;
            text-align: left;
        }

        .goal-scorers h4 {
            color: var(--gold);
            margin-bottom: 0.5rem;
        }

        .scorer {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.3rem 0;
            color: var(--text-muted);
        }

        .scorer .minute {
            color: var(--primary);
            font-weight: 600;
            min-width: 40px;
        }

        /* 球队详情弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.3s;
        }

        .modal-close:hover {
            color: var(--text);
        }

        .modal-team-info {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .modal-flag {
            font-size: 4rem;
        }

        .modal-team-details h2 {
            font-size: 1.5rem;
        }

        .modal-team-details p {
            color: var(--text-muted);
        }

        .modal-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }

        .stat-item {
            background: var(--darker);
            padding: 1rem;
            border-radius: 12px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--gold);
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 0.3rem;
        }

        /* 页脚 */
        .footer {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            margin-top: 4rem;
        }

        .footer a {
            color: var(--primary);
            text-decoration: none;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .hero-title {
                font-size: 2.5rem;
            }

            .countdown {
                gap: 1rem;
            }

            .countdown-item {
                min-width: 80px;
                padding: 1rem;
            }

            .countdown-number {
                font-size: 2rem;
            }

            .match-card {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }

            .match-team {
                min-width: auto;
                justify-content: center !important;
                text-align: center !important;
            }

            .team-select {
                flex-direction: column;
            }

            .nav-links {
                display: none;
            }
        }

        /* 滚动条 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--darker);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        /* 加载动画 */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 3rem;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 进度条 */
        .progress-bar {
            width: 100%;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 0.5rem;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--gold));
            border-radius: 2px;
            transition: width 1s ease;
        }
    </style>
</head>
<body>
    <div class="bg-animation"></div>

    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-content">
            <a href="#" class="logo">
                <span class="logo-icon">⚽</span>
                <span class="logo-text">FIFA <span>World Cup 2026</span></span>
            </a>
            <ul class="nav-links">
                <li><a href="#" class="active" onclick="showTab('home')">首页</a></li>
                <li><a href="#" onclick="showTab('groups')">分组</a></li>
                <li><a href="#" onclick="showTab('matches')">赛程</a></li>
                <li><a href="#" onclick="showTab('bracket')">对阵图</a></li>
                <li><a href="#" onclick="showTab('simulate')">模拟器</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <!-- 英雄区域 -->
        <section class="hero" id="home">
            <h1 class="hero-title">FIFA World Cup 2026</h1>
            <p class="hero-subtitle">第23届国际足联世界杯</p>

            <div class="hero-location">
                <div class="location-item">
                    <span>🇺🇸</span> 美国
                </div>
                <div class="location-item">
                    <span>🇲🇽</span> 墨西哥
                </div>
                <div class="location-item">
                    <span>🇨🇦</span> 加拿大
                </div>
                <div class="location-item">
                    <span>📅</span> 2026年6月11日 - 7月19日
                </div>
            </div>

            <div class="countdown" id="countdown">
                <div class="countdown-item">
                    <div class="countdown-number" id="days">---</div>
                    <div class="countdown-label">天</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-number" id="hours">--</div>
                    <div class="countdown-label">时</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-number" id="minutes">--</div>
                    <div class="countdown-label">分</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-number" id="seconds">--</div>
                    <div class="countdown-label">秒</div>
                </div>
            </div>
        </section>

        <!-- 标签页 -->
        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('groups')">🏆 小组赛</button>
            <button class="tab-btn" onclick="showTab('matches')">⚽ 赛程</button>
            <button class="tab-btn" onclick="showTab('bracket')">🎯 淘汰赛</button>
            <button class="tab-btn" onclick="showTab('simulate')">🎮 模拟器</button>
            <button class="tab-btn" onclick="showTab('stats')">📊 统计</button>
        </div>

        <!-- 小组赛 -->
        <section class="tab-content active" id="groups-section">
            <div class="groups-grid" id="groups-grid"></div>
        </section>

        <!-- 赛程 -->
        <section class="tab-content" id="matches-section">
            <div class="matches-container" id="matches-container"></div>
        </section>

        <!-- 淘汰赛对阵图 -->
        <section class="tab-content" id="bracket-section">
            <div class="bracket">
                <div class="bracket-container" id="bracket-container"></div>
            </div>
        </section>

        <!-- 模拟器 -->
        <section class="tab-content" id="simulate-section">
            <div class="simulator">
                <h2 class="simulator-title">⚽ 比赛模拟器</h2>
                <div class="team-select">
                    <div class="team-select-group">
                        <label>主队</label>
                        <select id="home-team"></select>
                    </div>
                    <span class="vs-text">VS</span>
                    <div class="team-select-group">
                        <label>客队</label>
                        <select id="away-team"></select>
                    </div>
                </div>
                <button class="simulate-btn" onclick="simulateMatch()">开始比赛</button>
                <div class="match-result" id="match-result">
                    <div class="result-teams">
                        <div class="result-team">
                            <span class="flag" id="result-home-flag"></span>
                            <span class="name" id="result-home-name"></span>
                        </div>
                        <div class="result-score" id="result-score"></div>
                        <div class="result-team">
                            <span class="flag" id="result-away-flag"></span>
                            <span class="name" id="result-away-name"></span>

                document.getElementById('days').textContent = '0';
                document.getElementById('hours').textContent = '0';
                document.getElementById('minutes').textContent = '0';
                document.getElementById('seconds').textContent = '0';
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = days;
            document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
            document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
            document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');

        function simulateMatch() {
            const homeCode = document.getElementById('home-team').value;
            const awayCode = document.getElementById('away-team').value;

            if (homeCode === awayCode) {
                alert('请选择不同的球队！');
                return;
            }

            const homeElo = homeTeam.elo + homeAdvantage;
            const awayElo = awayTeam.elo;

            const homeExpected = 1 / (1 + Math.pow(10, (awayElo - homeElo) / 400));
            const awayExpected = 1 - homeExpected;

            // 生成进球数

            const homeGoals = Math.round(avgGoals * homeExpected + (Math.random() - 0.5));
            const awayGoals = Math.round(avgGoals * awayExpected + (Math.random() - 0.5));

            // 显示结果

            document.getElementById('result-home-name').textContent = homeTeam.name;
            document.getElementById('result-away-flag').textContent = awayTeam.flag;
            document.getElementById('result-away-name').textContent = awayTeam.name;
            document.getElementById('result-score').textContent = `${Math.max(0, homeGoals)} - ${Math.max(0, awayGoals)}`;

            // 生成进球者

            const homePlayers = players[homeCode] || ['球员1', '球员2', '球员3'];
            const awayPlayers = players[awayCode] || ['球员1', '球员2', '球员3'];

            for (let i = 0; i < Math.max(0, homeGoals); i++) {
                const player = homePlayers[Math.floor(Math.random() * homePlayers.length)];
                const minute = Math.floor(Math.random() * 90) + 1;
                scorersDiv.innerHTML += `
                    <div class="scorer">
                        <span class="minute">${minute}'</span>
                        <span>${player}</span>
                        <span>${homeTeam.flag}</span>
                    </div>
                `;
            }

            for (let i = 0; i < Math.max(0, awayGoals); i++) {
                const player = awayPlayers[Math.floor(Math.random() * awayPlayers.length)];
                const minute = Math.floor(Math.random() * 90) + 1;
                scorersDiv.innerHTML += `
                    <div class="scorer">
                        <span class="minute">${minute}'</span>
                        <span>${player}</span>
                        <span>${awayTeam.flag}</span>
                    </div>
                `;
            }

            document.getElementById('match-result').classList.add('show');
        }

        // ============================================
        // 球队详情弹窗
        // ============================================

        function showTeamModal(code) {
            const team = teams[code];
            if (!team) return;

            document.getElementById('modal-flag').textContent = team.flag;
            document.getElementById('modal-name').textContent = team.name;
            document.getElementById('modal-ranking').textContent = `FIFA排名: ${team.ranking} | ${team.conf}`;

            const statsDiv = document.getElementById('modal-stats');
            statsDiv.innerHTML = `
                <div class="stat-item">
                    <div class="stat-value">${team.ranking}</div>
                    <div class="stat-label">FIFA排名</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">${team.elo}</div>
                    <div class="stat-label">ELO评分</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">${team.conf}</div>
                    <div class="stat-label">所属联合会</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">${team.group}</div>
                    <div class="stat-label">所在小组</div>
                </div>
            `;

            // 添加球星
            if (players[code]) {
                statsDiv.innerHTML += `
                    <div class="stat-item" style="grid-column: span 2;">
                        <div class="stat-value" style="font-size: 1rem;">${players[code].join('、')}</div>
                        <div class="stat-label">核心球员</div>
                    </div>
                `;
            }

            document.getElementById('team-modal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('team-modal').classList.remove('show');
        }

        // 点击弹窗外部关闭
        document.getElementById('team-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // ESC关闭弹窗
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // ============================================
        // 初始化
        // ============================================

        document.addEventListener('DOMContentLoaded', function() {
            renderGroups();
            renderMatches();
            renderBracket();
            initSimulator();
        });
    </script>
</body>
</html>
